## Configuration file for CAVA (Gerado nativamente via Matugen templates)

[general]
live-config = 1
framerate = 60
autosens = 1
bars = 0
bar_width = 2
bar_spacing = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 10000

[input]
method = pulse
source = auto

[output]
method = noncurses

[color]
gradient = 1
gradient_color_1 = '{{colors.primary.default.hex}}'
gradient_color_2 = '{{colors.primary_fixed_dim.default.hex}}'
gradient_color_3 = '{{colors.primary_fixed.default.hex}}'
gradient_color_4 = '{{colors.secondary_fixed.default.hex}}'
gradient_color_5 = '{{colors.secondary.default.hex}}'
gradient_color_6 = '{{colors.secondary_container.default.hex}}'
gradient_color_7 = '{{colors.tertiary_fixed_dim.default.hex}}'
gradient_color_8 = '{{colors.tertiary.default.hex}}'

[smoothing]
monstercat = 0
waves = 0
noise_reduction = 77
