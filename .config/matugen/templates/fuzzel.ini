# Gerado pelo matugen (~/.config/matugen/templates/fuzzel.ini) — não editar aqui.
# Menu de apps do Modo Gaming no estilo do Walker do Omarchy (omarchy-default):
# caixa de 644 px, cantos retos, borda de 2 px na cor do texto, monoespaçada 18 px,
# ícones pequenos, seleção com fundo 7% e texto na cor de destaque. Roda do mouse rola a lista.
[main]
font=JetBrainsMono Nerd Font:pixelsize=18
dpi-aware=no
use-bold=no
prompt=""
placeholder= Buscar...
icon-theme=WhiteSur-dark
icons-enabled=yes
terminal=foot -e
layer=overlay
exit-on-keyboard-focus-loss=yes
anchor=center
width=56
lines=6
horizontal-pad=20
vertical-pad=20
inner-pad=10
line-height=48px
image-size-ratio=0.4
match-mode=fzf
sort-result=yes
fields=filename,name,generic,keywords
enable-mouse=yes
launch-prefix=systemd-run --user --scope --quiet --collect

[colors]
background=2b2d33ff
text={{colors.on_surface.default.hex | replace: "#", ""}}ff
prompt={{colors.on_surface.default.hex | replace: "#", ""}}ff
placeholder={{colors.on_surface.default.hex | replace: "#", ""}}80
input={{colors.on_surface.default.hex | replace: "#", ""}}ff
match={{colors.primary.default.hex | replace: "#", ""}}ff
selection={{colors.on_surface.default.hex | replace: "#", ""}}12
selection-text={{colors.primary.default.hex | replace: "#", ""}}ff
selection-match={{colors.primary.default.hex | replace: "#", ""}}ff
border={{colors.on_surface.default.hex | replace: "#", ""}}ff

[border]
width=2
radius=0
selection-radius=0

[dmenu]
exit-immediately-if-empty=yes
