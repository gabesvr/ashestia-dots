# ── foot terminal ─────────────────────────────────────
# Tema: Matugen Material You — Dinâmico, Transparente
# Fonte: JetBrains Mono Nerd Font (Limpa, Moderna e Legível)
# ──────────────────────────────────────────────────────

include=~/.config/foot/theme.ini

[colors-dark]
alpha=1.0
background=2b2d33
foreground=d6d8de

cursor=2b2d33 d6d8de

regular0=3a3d45
regular1=ff6b68
regular2=8fc46f
regular3=e5c76b
regular4=7fa8e6
regular5=c792ea
regular6=6cc4c0
regular7=d6d8de

bright0=6b6f7a
bright1=ff8a85
bright2=a8d98a
bright3=f2d98a
bright4=9bbcf0
bright5=d9a9f2
bright6=8fd8d4
bright7=f2f3f6

urls=7fa8e6
selection-foreground=ffffff
selection-background=44577a

[colors-light]
alpha=1.0
background=2b2d33
foreground=d6d8de

cursor=2b2d33 d6d8de

regular0=3a3d45
regular1=ff6b68
regular2=8fc46f
regular3=e5c76b
regular4=7fa8e6
regular5=c792ea
regular6=6cc4c0
regular7=d6d8de

bright0=6b6f7a
bright1=ff8a85
bright2=a8d98a
bright3=f2d98a
bright4=9bbcf0
bright5=d9a9f2
bright6=8fd8d4
bright7=f2f3f6

urls=7fa8e6
selection-foreground=ffffff
selection-background=44577a

[main]
font=DejaVu Sans Mono:size=12, JetBrainsMono Nerd Font Mono:size=12
font-bold=DejaVu Sans Mono:style=Bold:size=12, JetBrainsMono Nerd Font Mono:style=Bold:size=12
dpi-aware=no
pad=18x14
selection-target=both

[scrollback]
lines=10000

[cursor]
style=block
blink=no
blink-rate=530

[mouse]
hide-when-typing=yes

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
search-start=Control+Shift+f

[mouse-bindings]
select-extend=none
primary-paste=none
clipboard-paste=BTN_RIGHT

[csd]
preferred=client
size=30
color=ff2b2d33
border-width=1
border-color=ff3f424a
button-width=0
