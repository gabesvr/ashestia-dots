# ── foot terminal ─────────────────────────────────────
# Tema: Matugen Material You — Dinâmico, Transparente
# Fonte: JetBrains Mono Nerd Font (Limpa, Moderna e Legível)
# ──────────────────────────────────────────────────────

include=~/.config/foot/theme.ini

[colors-dark]
alpha=1.0
background=000000
foreground=e1e2e9

[colors-light]
alpha=1.0
background=000000
foreground=e1e2e9

[main]
font=JetBrainsMono Nerd Font:size=12
font-bold=JetBrainsMono Nerd Font:style=Bold:size=12
dpi-aware=no
pad=16x12
selection-target=both

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes
blink-rate=530

[mouse]
hide-when-typing=yes

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
search-start=Control+Shift+f

[mouse-bindings]
select-extend=none
primary-paste=none
clipboard-paste=BTN_RIGHT
