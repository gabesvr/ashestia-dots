; cava do widget CavaWidget (Quickshell) — saída raw ASCII lida via stdout
[general]
framerate = 60
autosens = 1
bars = 48          ; substituído pelo widget conforme a largura do card
sleep_timer = 3
lower_cutoff_freq = 50
higher_cutoff_freq = 10000

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = stereo

[smoothing]
noise_reduction = 77
