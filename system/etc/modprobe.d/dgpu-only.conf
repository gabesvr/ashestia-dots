# amdgpu (iGPU) nao carrega sozinho: quem decide e o igpu-guard.service (modo do MUX, ver `gpu-mode`).
#   MUX NVIDIA -> iGPU removido do PCI; MUX hibrido -> `modprobe amdgpu`.
blacklist amdgpu
# NVIDIA: Page Attribute Table (menos overhead de CPU) e sem zerar memoria de sistema a cada alocacao
options nvidia NVreg_UsePageAttributeTable=1 NVreg_InitializeSystemMemoryAllocations=0
